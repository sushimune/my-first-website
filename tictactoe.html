<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>

<style>
body {
background: linear-gradient(135deg, #ffd6ec, #ffeef8);
font-family: Arial, sans-serif;
text-align: center;
}

.game-box {
background: white;
width: 400px;
margin: 60px auto;
padding: 25px;
border-radius: 25px;
box-shadow: 0 0 20px pink;
}

h1 {
color: #ff69b4;
}

#turnText {
font-size: 22px;
color: #444;
}

.board {
display: grid;
grid-template-columns: repeat(3, 100px);
gap: 10px;
justify-content: center;
margin: 25px 0;
}

.cell {
width: 100px;
height: 100px;
font-size: 45px;
font-weight: bold;
background: #fff0f7;
border: 3px solid #ff9ccc;
border-radius: 15px;
cursor: pointer;
}

.cell:hover {
background: #ffd6ec;
}

#resetBtn {
background: #ff69b4;
color: white;
border: none;
padding: 12px 25px;
border-radius: 20px;
font-size: 18px;
cursor: pointer;
}

a {
color: #ff69b4;
font-weight: bold;
}
</style>
</head>

<body>

<div class="game-box">
<h1>✨ Tic Tac Toe ✨</h1>
<p id="turnText">Player X's Turn</p>

<div class="board">
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
<button class="cell"></button>
</div>

<button id="resetBtn">Reset Game</button>

<br><br>
<a href="index.html">Back to Home</a>
</div>

<script>
let cells = document.querySelectorAll(".cell");
let turnText = document.getElementById("turnText");
let resetBtn = document.getElementById("resetBtn");

let currentPlayer = "X";
let gameOver = false;

let winningCombos = [
[0, 1, 2],
[3, 4, 5],
[6, 7, 8],
[0, 3, 6],
[1, 4, 7],
[2, 5, 8],
[0, 4, 8],
[2, 4, 6]
];

cells.forEach(function(cell) {
cell.addEventListener("click", function() {
if (cell.textContent === "" && gameOver === false) {
cell.textContent = currentPlayer;

checkWinner();

if (!gameOver) {
currentPlayer = currentPlayer === "X" ? "O" : "X";
turnText.textContent = "Player " + currentPlayer + "'s Turn";
}
}
});
});

function checkWinner() {
for (let combo of winningCombos) {
let a = combo[0];
let b = combo[1];
let c = combo[2];

if (
cells[a].textContent !== "" &&
cells[a].textContent === cells[b].textContent &&
cells[b].textContent === cells[c].textContent
) {
turnText.textContent = "🎉 Player " + currentPlayer + " Wins!";
gameOver = true;
return;
}
}

let tie = true;

cells.forEach(function(cell) {
if (cell.textContent === "") {
tie = false;
}
});

if (tie) {
turnText.textContent = "It's a tie!";
gameOver = true;
}
}

resetBtn.addEventListener("click", function() {
cells.forEach(function(cell) {
cell.textContent = "";
});

currentPlayer = "X";
gameOver = false;
turnText.textContent = "Player X's Turn";
});
</script>

</body>
</html>
